
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคำนวณคะแนนครู</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #eaf2ff, #f7f9fc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #243b53;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(40, 70, 120, 0.12);
      text-align: center;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      color: #214e91;
      font-size: 30px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #64748b;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .menu-button {
      display: block;
      width: 100%;
      padding: 22px 20px;
      margin: 16px 0;
      border: none;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 21px;
      font-weight: bold;
      transition: 0.2s;
    }

    .menu-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    }

    .assistant {
      background: #3478d4;
    }

    .specialist {
      background: #159477;
    }

    .description {
      display: block;
      font-size: 14px;
      font-weight: normal;
      margin-top: 8px;
      opacity: 0.95;
    }

    footer {
      margin-top: 28px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">👩‍🏫</div>

    <h1>ระบบคำนวณคะแนนครู</h1>

    <p class="subtitle">
      เลือกประเภทการคำนวณคะแนนที่ต้องการใช้งาน
    </p>

    <a class="menu-button assistant"
       href="kru-phu-chuai.html">
      ครูผู้ช่วย
      <span class="description">
        เข้าสู่หน้าคำนวณคะแนนครูผู้ช่วย
      </span>
    </a>

    <a class="menu-button specialist"
       href="kru-specialist.html">
      ครู–ครูเชี่ยวชาญ
      <span class="description">
        เข้าสู่หน้าคำนวณคะแนนตามวิทยฐานะ
      </span>
    </a>

    <footer>
      ระบบช่วยคำนวณคะแนนสำหรับครู
    </footer>
  </main>
</body>
</html>
